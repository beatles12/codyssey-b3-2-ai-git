<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="출력 검증: 재생성 대신 후처리, 제목 길이는 자르고 형식 누락은 경고">
  <defs>
    <style>
      text{font-family:Pretendard,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR',sans-serif}
      .m{font-family:Consolas,'D2Coding','Cascadia Mono',monospace}
      .h{font-size:17px;font-weight:800;fill:#15324a}
      .t{font-size:14px;fill:#4b647a}
      .s{font-size:14px;font-weight:700}
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="438" rx="22" fill="#fff" stroke="#d7e2eb" stroke-width="2"/>
  <text x="36" y="46" font-size="20" font-weight="800" fill="#15324a">AI가 쓴 글을 다시 검사하는 이유와 방법</text>
  <text x="1164" y="46" class="t" text-anchor="end">AI가 지시를 반드시 지킨다는 보장이 없기 때문</text>

  <!-- 재생성 -->
  <rect x="36" y="70" width="540" height="128" rx="16" fill="#fafbfc" stroke="#d7e2eb"/>
  <text x="56" y="100" class="h">재생성 <tspan class="t">— 규칙을 어기면 AI에 다시 부탁</tspan></text>
  <g class="s">
    <rect x="56" y="116" width="96" height="34" rx="9" fill="#f1edfd"/><text x="104" y="138" fill="#4f37a3" text-anchor="middle">AI 요청</text>
    <text x="164" y="139" fill="#9bb2c4">→</text>
    <rect x="184" y="116" width="70" height="34" rx="9" fill="#eef2f6"/><text x="219" y="138" fill="#33506a" text-anchor="middle">검사</text>
    <text x="266" y="139" fill="#9bb2c4">→</text>
    <rect x="286" y="116" width="130" height="34" rx="9" fill="#f1edfd" stroke="#b9a5f0" stroke-dasharray="5 4"/><text x="351" y="138" fill="#4f37a3" text-anchor="middle">다시 AI 요청</text>
    <text x="428" y="139" fill="#9bb2c4">→ …</text>
  </g>
  <text x="56" y="182" class="t">요청이 늘어 시간·비용 증가, 다시 써도 규칙을 지킨다는 보장 없음</text>

  <!-- 후처리 -->
  <rect x="36" y="214" width="540" height="200" rx="16" fill="#f2faf8" stroke="#139a8f" stroke-width="2.5"/>
  <rect x="420" y="228" width="140" height="26" rx="13" fill="#139a8f"/><text x="490" y="246" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">이 도구의 선택</text>
  <text x="56" y="246" class="h">후처리 <tspan class="t">— 프로그램이 정리</tspan></text>
  <g class="s">
    <rect x="56" y="266" width="120" height="34" rx="9" fill="#f1edfd"/><text x="116" y="288" fill="#4f37a3" text-anchor="middle">AI 요청 1회</text>
    <text x="186" y="289" fill="#9bb2c4">→</text>
    <rect x="206" y="266" width="150" height="34" rx="9" fill="#fff"/><text x="281" y="288" fill="#15324a" text-anchor="middle">제목 길이 자르기</text>
    <text x="366" y="289" fill="#9bb2c4">→</text>
    <rect x="386" y="266" width="170" height="34" rx="9" fill="#fff"/><text x="471" y="288" fill="#15324a" text-anchor="middle">형식 검사 · [WARN]</text>
  </g>
  <text x="56" y="332" class="t">✓ AI 요청은 항상 1회 — 비용과 결과를 예측할 수 있음</text>
  <text x="56" y="358" class="t">✓ 제목 길이는 프로그램이 확실하게 맞춤</text>
  <text x="56" y="384" class="t">△ 빠진 섹션은 자동으로 채우지 않음 → 경고만 하고 사람이 고침</text>

  <!-- 규칙판 -->
  <rect x="604" y="70" width="560" height="344" rx="16" fill="#fff" stroke="#d7e2eb"/>
  <text x="624" y="102" class="h">규칙판 <tspan class="t">(config.py의 기준값)</tspan></text>
  <g>
    <rect x="624" y="118" width="520" height="62" rx="12" fill="#f4f8fb"/>
    <text x="644" y="144" font-size="15" font-weight="800" fill="#15324a">커밋 제목 · 최대 72자</text>
    <text x="1124" y="144" class="s" fill="#0f6e7a" text-anchor="end">자름</text>
    <text x="644" y="166" class="m" font-size="13" fill="#5b7186">shorten_title() → validate_commit_message()</text>
    <rect x="624" y="188" width="520" height="62" rx="12" fill="#f4f8fb"/>
    <text x="644" y="214" font-size="15" font-weight="800" fill="#15324a">커밋 본문(선택) · 불릿 또는 파일명</text>
    <text x="1124" y="214" class="s" fill="#b06f10" text-anchor="end">[WARN]</text>
    <text x="644" y="236" class="m" font-size="13" fill="#5b7186">validate_commit_message()</text>
    <rect x="624" y="258" width="520" height="62" rx="12" fill="#f4f8fb"/>
    <text x="644" y="284" font-size="15" font-weight="800" fill="#15324a">PR 제목 · 한 줄, 최대 80자</text>
    <text x="1124" y="284" class="s" fill="#0f6e7a" text-anchor="end">자름</text>
    <text x="644" y="306" class="m" font-size="13" fill="#5b7186">shorten_title() → validate_pr_title()</text>
    <rect x="624" y="328" width="520" height="62" rx="12" fill="#f4f8fb"/>
    <text x="644" y="354" font-size="15" font-weight="800" fill="#15324a">PR 본문 · Why / What / How to Test + 불릿</text>
    <text x="1124" y="354" class="s" fill="#b06f10" text-anchor="end">[WARN]</text>
    <text x="644" y="376" class="m" font-size="13" fill="#5b7186">validate_pr_body()</text>
  </g>
</svg>
