<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="temperature와 max_tokens의 차이, 그리고 max_tokens 220과 800 실측 비교">
  <defs>
    <style>
      text{font-family:Pretendard,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR',sans-serif}
      .mono{font-family:Consolas,'D2Coding','Cascadia Mono',monospace}
      .h{font-size:21px;font-weight:800;fill:#15324a}
      .s{font-size:15px;fill:#3c5770}
      .lab{font-size:14px;font-weight:800}
      .cut{animation:blink 1.6s ease-in-out infinite}
      @keyframes blink{50%{opacity:.35}}
    </style>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fdeeec"/><line x1="0" y1="0" x2="0" y2="8" stroke="#f2b8ae" stroke-width="3"/></pattern>
  </defs>
  <rect x="1" y="1" width="1198" height="468" rx="22" fill="#fff" stroke="#d7e2eb" stroke-width="2"/>

  <!-- temperature -->
  <rect x="28" y="28" width="520" height="196" rx="16" fill="#f4f8fb"/>
  <text x="52" y="66" class="h mono">temperature</text>
  <text x="208" y="66" class="h">표현을 얼마나 다양하게</text>
  <line x1="62" y1="122" x2="512" y2="122" stroke="#cdd9e3" stroke-width="10" stroke-linecap="round"/>
  <line x1="62" y1="122" x2="197" y2="122" stroke="#139a8f" stroke-width="10" stroke-linecap="round"/>
  <circle cx="197" cy="122" r="15" fill="#fff" stroke="#139a8f" stroke-width="5"/>
  <text x="197" y="100" font-size="15" font-weight="800" fill="#139a8f" text-anchor="middle">기본 0.3</text>
  <text x="62" y="156" class="s">0 · 일관된 표현</text>
  <text x="512" y="156" class="s" text-anchor="end">다양한 표현 · 1</text>
  <rect x="52" y="176" width="472" height="32" rx="9" fill="#fff4dc"/>
  <text x="288" y="198" font-size="14.5" font-weight="700" fill="#8a5a0c" text-anchor="middle">정확성을 높이는 값은 아님 · 이번 과제에서 실측 비교는 안 함</text>

  <!-- max_tokens -->
  <rect x="28" y="244" width="520" height="196" rx="16" fill="#f4f8fb"/>
  <text x="52" y="282" class="h mono">max_tokens</text>
  <text x="196" y="282" class="h">답변 분량의 상한</text>
  <rect x="62" y="306" width="450" height="40" rx="10" fill="#e3ebf1"/>
  <rect x="62" y="306" width="300" height="40" rx="10" fill="#139a8f" opacity=".85"/>
  <line x1="420" y1="296" x2="420" y2="356" stroke="#d8962b" stroke-width="3" stroke-dasharray="5 4"/>
  <text x="420" y="290" font-size="13.5" font-weight="800" fill="#b06f10" text-anchor="middle">상한</text>
  <text x="80" y="332" font-size="15" font-weight="700" fill="#fff">AI가 실제로 쓴 분량</text>
  <text x="62" y="378" class="s">목표 분량이 아니라 <tspan font-weight="800">넘지 못하는 선</tspan>입니다.</text>
  <text x="62" y="402" class="s">너무 낮으면 글이 중간에 끊깁니다.</text>
  <text x="62" y="426" class="s">기본 <tspan class="mono" font-weight="700">1024</tspan> · 허용 <tspan class="mono" font-weight="700">1~4096</tspan></text>

  <!-- 실측 -->
  <text x="584" y="66" class="h">실측 — 출력 상한만 바꿨을 때</text>
  <text x="584" y="92" class="s">같은 변경 3파일·47줄 · temperature 0.3 · <tspan class="mono">pr --safe-mode</tspan> · 각 1회 요청</text>

  <text x="584" y="146" font-size="26" font-weight="800" fill="#15324a" class="mono">220</text>
  <rect x="660" y="120" width="160" height="42" rx="9" fill="#e9f6ee" stroke="#9fd2b4"/><text x="740" y="147" class="lab" fill="#227a4c" text-anchor="middle">Why ✓</text>
  <rect x="828" y="120" width="160" height="42" rx="9" fill="#fff4dc" stroke="#f0cf8a"/><rect x="828" y="120" width="92" height="42" rx="9" fill="#ffe3a6"/>
  <text x="908" y="147" class="lab" fill="#8a5a0c" text-anchor="middle">What ✂ 끊김</text>
  <rect x="996" y="120" width="176" height="42" rx="9" fill="url(#hatch)" stroke="#e8a59c" stroke-dasharray="6 4"/><text x="1084" y="147" class="lab" fill="#b8352a" text-anchor="middle">How to Test ✕</text>
  <rect x="660" y="172" width="512" height="34" rx="8" fill="#26323d"/>
  <text x="676" y="195" class="mono cut" font-size="14.5" font-weight="700" fill="#ffc861">[WARN] How to Test 섹션이 없습니다.</text>

  <text x="584" y="280" font-size="26" font-weight="800" fill="#15324a" class="mono">800</text>
  <rect x="660" y="254" width="160" height="42" rx="9" fill="#e9f6ee" stroke="#9fd2b4"/><text x="740" y="281" class="lab" fill="#227a4c" text-anchor="middle">Why ✓</text>
  <rect x="828" y="254" width="160" height="42" rx="9" fill="#e9f6ee" stroke="#9fd2b4"/><text x="908" y="281" class="lab" fill="#227a4c" text-anchor="middle">What ✓</text>
  <rect x="996" y="254" width="176" height="42" rx="9" fill="#e9f6ee" stroke="#9fd2b4"/><text x="1084" y="281" class="lab" fill="#227a4c" text-anchor="middle">How to Test ✓</text>
  <rect x="660" y="306" width="512" height="34" rx="8" fill="#26323d"/>
  <text x="676" y="329" class="mono" font-size="14.5" font-weight="700" fill="#7fe0c6">경고 없음 · 세 섹션 완성</text>

  <rect x="584" y="366" width="588" height="74" rx="14" fill="#e6f4f2"/>
  <text x="604" y="398" font-size="16" font-weight="800" fill="#0f6e7a">왜 실행 옵션(CLI)으로 만들었나</text>
  <text x="604" y="424" font-size="15" fill="#1d4f55">코드를 고치지 않고 옵션 하나만 바꿔 다시 실행 → 비교와 재현이 쉬움</text>
</svg>
