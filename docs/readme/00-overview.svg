<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="B3-2 한눈에 보기: Git 변경을 입력으로 AI가 커밋·PR 초안을 쓰고 사람이 검토">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11304a"/><stop offset="1" stop-color="#1b5d70"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fe3d6"/></marker>
    <style>
      text{font-family:Pretendard,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR',sans-serif}
      .mono{font-family:Consolas,'D2Coding','Cascadia Mono',monospace}
      .flow{stroke:#9fe3d6;stroke-width:3;fill:none;stroke-dasharray:9 7;animation:dash 1.1s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-16}}
    </style>
  </defs>
  <rect width="1200" height="520" rx="26" fill="url(#bg)"/>
  <circle cx="1120" cy="40" r="150" fill="#ffffff" opacity=".05"/>

  <text x="56" y="70" fill="#bfe3ef" font-size="15" font-weight="800" letter-spacing="3">CODYSSEY B3-2 · PYTHON CLI × AI API</text>
  <text x="56" y="122" fill="#fff" font-size="40" font-weight="800">Git에 남은 변경을 AI가 읽고,</text>
  <text x="56" y="172" fill="#fff" font-size="40" font-weight="800">커밋·PR 설명 <tspan fill="#9fe3d6">초안</tspan>을 대신 씁니다</text>

  <g font-size="15" font-weight="800">
    <rect x="850" y="92" width="150" height="36" rx="18" fill="#ffffff" opacity=".14"/><text x="925" y="116" fill="#fff" text-anchor="middle">AI 요청 1회</text>
    <rect x="1010" y="92" width="150" height="36" rx="18" fill="#ffffff" opacity=".14"/><text x="1085" y="116" fill="#fff" text-anchor="middle">외부 패키지 0개</text>
    <rect x="850" y="138" width="150" height="36" rx="18" fill="#ffffff" opacity=".14"/><text x="925" y="162" fill="#fff" text-anchor="middle">커밋 제목 ≤ 72자</text>
    <rect x="1010" y="138" width="150" height="36" rx="18" fill="#ffffff" opacity=".14"/><text x="1085" y="162" fill="#fff" text-anchor="middle">PR 제목 ≤ 80자</text>
  </g>

  <!-- 입력 -->
  <rect x="56" y="214" width="320" height="196" rx="18" fill="#fff"/>
  <rect x="56" y="214" width="320" height="8" rx="4" fill="#4f8fd0"/>
  <text x="80" y="256" fill="#4f8fd0" font-size="15" font-weight="800" letter-spacing="2">INPUT · 입력</text>
  <text x="80" y="290" fill="#15324a" font-size="22" font-weight="800">Git 수정 장부</text>
  <rect x="80" y="308" width="272" height="38" rx="9" fill="#eef4fb"/>
  <text x="94" y="333" class="mono" fill="#1d4f80" font-size="15" font-weight="700">git status</text>
  <text x="338" y="333" fill="#3c5770" font-size="15" text-anchor="end">바뀐 파일 목록</text>
  <rect x="80" y="354" width="272" height="38" rx="9" fill="#eef4fb"/>
  <text x="94" y="379" class="mono" fill="#1d4f80" font-size="15" font-weight="700">git diff</text>
  <text x="338" y="379" fill="#3c5770" font-size="15" text-anchor="end">바뀐 줄 내용</text>

  <path class="flow" d="M384 312 H432" marker-end="url(#ah)"/>

  <!-- 처리 -->
  <rect x="440" y="214" width="320" height="196" rx="18" fill="#fff"/>
  <rect x="440" y="214" width="320" height="8" rx="4" fill="#139a8f"/>
  <text x="464" y="256" fill="#139a8f" font-size="15" font-weight="800" letter-spacing="2">PROCESS · 처리</text>
  <g font-size="17" font-weight="700" fill="#15324a">
    <circle cx="478" cy="294" r="13" fill="#139a8f"/><text x="478" y="300" fill="#fff" font-size="14" text-anchor="middle">1</text>
    <text x="502" y="300">AI 작성 지시서 만들기</text>
    <circle cx="478" cy="340" r="13" fill="#139a8f"/><text x="478" y="346" fill="#fff" font-size="14" text-anchor="middle">2</text>
    <text x="502" y="346">AI API에 <tspan fill="#139a8f" font-weight="800">1회</tspan> 요청</text>
    <circle cx="478" cy="386" r="13" fill="#139a8f"/><text x="478" y="392" fill="#fff" font-size="14" text-anchor="middle">3</text>
    <text x="502" y="392">길이·형식 검사</text>
  </g>

  <path class="flow" d="M768 312 H816" marker-end="url(#ah)"/>

  <!-- 출력 -->
  <rect x="824" y="214" width="320" height="196" rx="18" fill="#fff"/>
  <rect x="824" y="214" width="320" height="8" rx="4" fill="#d8962b"/>
  <text x="848" y="256" fill="#c07d16" font-size="15" font-weight="800" letter-spacing="2">OUTPUT · 출력</text>
  <text x="848" y="290" fill="#15324a" font-size="22" font-weight="800">터미널에 초안</text>
  <rect x="848" y="308" width="272" height="38" rx="9" fill="#fff6e6"/>
  <text x="984" y="333" class="mono" fill="#7a4f0c" font-size="15" font-weight="700" text-anchor="middle">commit → Commit Message</text>
  <rect x="848" y="354" width="272" height="38" rx="9" fill="#fff6e6"/>
  <text x="984" y="379" class="mono" fill="#7a4f0c" font-size="15" font-weight="700" text-anchor="middle">pr → PR Title / PR Body</text>

  <!-- 경계 -->
  <rect x="56" y="436" width="1088" height="52" rx="14" fill="#ffffff" opacity=".12"/>
  <text x="84" y="469" fill="#ffd0c4" font-size="17" font-weight="800">✕ 하지 않는 일</text>
  <text x="214" y="469" fill="#fff" font-size="17">자동 git commit · git push · GitHub PR 등록</text>
  <text x="1116" y="469" fill="#9fe3d6" font-size="17" font-weight="800" text-anchor="end">텍스트 초안만 → 사람이 검토 후 사용</text>
</svg>
