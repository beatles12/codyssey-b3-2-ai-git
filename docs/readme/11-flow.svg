<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="명령 한 번의 처리 순서 1부터 7, 그리고 중간에 멈추는 네 가지 경우">
  <defs>
    <style>
      text{font-family:Pretendard,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR',sans-serif}
      .mono{font-family:Consolas,'D2Coding','Cascadia Mono',monospace}
      .flow{stroke:#139a8f;stroke-width:4;fill:none;stroke-dasharray:10 8;animation:dash 1.1s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-18}}
      .exit{stroke-width:2.2;fill:none}
      .nm{font-size:17px;font-weight:800;fill:#15324a}
      .fl{font-size:13px;fill:#5b7186}
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="428" rx="22" fill="#fff" stroke="#d7e2eb" stroke-width="2"/>

  <!-- 중간 종료 4가지 -->
  <path class="exit" d="M110 222 V86" stroke="#d0574b"/>
  <rect x="24" y="40" width="270" height="46" rx="12" fill="#fdeeec" stroke="#e8a59c"/>
  <text x="40" y="69" font-size="15" font-weight="800" fill="#b8352a">① 옵션 범위 밖</text>
  <text x="280" y="69" font-size="14" fill="#8f2b20" text-anchor="end">[ERROR] · 코드 2</text>

  <path class="exit" d="M270 222 V156" stroke="#2f9a63"/>
  <rect x="200" y="110" width="300" height="46" rx="12" fill="#e9f6ee" stroke="#9fd2b4"/>
  <text x="216" y="139" font-size="15" font-weight="800" fill="#227a4c">② 변경 없음</text>
  <text x="486" y="139" font-size="14" fill="#1d6a42" text-anchor="end">정상 종료 · AI 0회</text>

  <path class="exit" d="M590 222 V86" stroke="#2f9a63"/>
  <rect x="520" y="40" width="330" height="46" rx="12" fill="#e9f6ee" stroke="#9fd2b4"/>
  <text x="536" y="69" font-size="15" font-weight="800" fill="#227a4c">④ --dry-run</text>
  <text x="836" y="69" font-size="14" fill="#1d6a42" text-anchor="end">지시서만 출력 · AI 0회</text>

  <path class="exit" d="M750 222 V156" stroke="#d0574b"/>
  <rect x="676" y="110" width="350" height="46" rx="12" fill="#fdeeec" stroke="#e8a59c"/>
  <text x="692" y="139" font-size="15" font-weight="800" fill="#b8352a">⑤ API 키 없음</text>
  <text x="1012" y="139" font-size="14" fill="#8f2b20" text-anchor="end">[ERROR] · 코드 1 · AI 0회</text>

  <!-- 본 흐름 -->
  <path class="flow" d="M110 260 H1070"/>
  <g>
    <circle cx="110" cy="260" r="36" fill="#139a8f"/><text x="110" y="270" fill="#fff" font-size="28" font-weight="800" text-anchor="middle">1</text>
    <circle cx="270" cy="260" r="36" fill="#139a8f"/><text x="270" y="270" fill="#fff" font-size="28" font-weight="800" text-anchor="middle">2</text>
    <circle cx="430" cy="260" r="36" fill="#fff" stroke="#139a8f" stroke-width="3" stroke-dasharray="7 5"/><text x="430" y="270" fill="#139a8f" font-size="28" font-weight="800" text-anchor="middle">3</text>
    <circle cx="590" cy="260" r="36" fill="#139a8f"/><text x="590" y="270" fill="#fff" font-size="28" font-weight="800" text-anchor="middle">4</text>
    <circle cx="750" cy="260" r="36" fill="#139a8f"/><text x="750" y="270" fill="#fff" font-size="28" font-weight="800" text-anchor="middle">5</text>
    <circle cx="910" cy="260" r="36" fill="#139a8f"/><text x="910" y="270" fill="#fff" font-size="28" font-weight="800" text-anchor="middle">6</text>
    <circle cx="1070" cy="260" r="40" fill="#d8962b"/><text x="1070" y="270" fill="#fff" font-size="28" font-weight="800" text-anchor="middle">7</text>
  </g>
  <g text-anchor="middle">
    <text x="110" y="326" class="nm">명령 입력</text><text x="110" y="347" class="fl mono">main.py · cli.py</text>
    <text x="270" y="326" class="nm">Git 변경 수집</text><text x="270" y="347" class="fl mono">git_collector.py</text>
    <text x="430" y="326" class="nm">민감정보 마스킹</text><text x="430" y="347" class="fl mono">safety.py</text>
    <text x="590" y="326" class="nm">작성 지시서</text><text x="590" y="347" class="fl mono">prompt_builder.py</text>
    <text x="750" y="326" class="nm">AI 요청·수신</text><text x="750" y="347" class="fl mono">ai_client.py</text>
    <text x="910" y="326" class="nm">정리·형식 점검</text><text x="910" y="347" class="fl mono">formatter.py</text>
    <text x="1070" y="326" class="nm">초안 출력</text><text x="1070" y="347" class="fl">사람이 검토</text>
  </g>
  <rect x="362" y="194" width="136" height="26" rx="13" fill="#e6f4f2"/><text x="430" y="213" font-size="13" font-weight="800" fill="#0f6e7a" text-anchor="middle">--safe-mode 시</text>

  <line x1="24" y1="378" x2="1176" y2="378" stroke="#e3ebf1" stroke-width="2"/>
  <text x="40" y="408" font-size="15" fill="#33506a"><tspan font-weight="800" fill="#139a8f">정상 실행</tspan> ①→⑦ · AI 요청 1회</text>
  <text x="600" y="408" font-size="15" fill="#33506a" text-anchor="middle"><tspan font-weight="800" fill="#2f9a63">초록</tspan> 정상 종료 · <tspan font-weight="800" fill="#b8352a">빨강</tspan> 오류 안내 후 종료</text>
  <text x="1160" y="408" font-size="15" fill="#33506a" text-anchor="end">점선 ③은 옵션을 켰을 때만</text>
</svg>
